        function generateFullHTML() {
            const type = document.getElementById('presellType').value;
            const lang = document.getElementById('presellLang').value;
            const affLink = document.getElementById('affLink').value;
            const bgUrl = document.getElementById('bgUrl').value;
            const accent = document.getElementById('accentColor').value;

            const isRtl = (lang === 'ar') ? 'dir="rtl"' : '';
            let layoutContent = "";

            if (type === 'country') {
                const t = DATA.country[lang];
                layoutContent = `
                <div class="modal-card layout-country" ${isRtl}>
                    <a href="${affLink}" class="close-btn">&times;</a>
                    <span class="badge">${t.badge}</span>
                    <h1 class="modal-title">${t.title}</h1>
                    <p class="modal-subtitle">${t.sub}</p>
                    <a href="${affLink}" class="country-option main-opt">
                        <span>${t.optMain}</span>
                        <span class="status-tag">${t.optMainBadge}</span>
                    </a>
                    <a href="${affLink}" class="country-option sec-opt">
                        <span>${t.optSec}</span>
                    </a>
                    <a href="${affLink}" class="cta-btn">${t.cta}</a>
                    <div class="footer-text">${t.footer}</div>
                </div>`;
            } 
            else if (type === 'age') {
                const t = DATA.age[lang];
                layoutContent = `
                <div class="modal-card layout-age" ${isRtl}>
                    <a href="${affLink}" class="close-btn">&times;</a>
                    <div class="warning-icon">🔞</div>
                    <h1 class="modal-title">${t.title}</h1>
                    <p class="modal-subtitle">${t.sub}</p>
                    <div class="btn-group">
                        <a href="${affLink}" class="cta-btn btn-yes">${t.btnYes}</a>
                        <a href="${affLink}" class="btn-no">${t.btnNo}</a>
                    </div>
                    <div class="footer-text">${t.footer}</div>
                </div>`;
            } 
            else if (type === 'cookies') {
                const t = DATA.cookies[lang];
                layoutContent = `
                <div class="modal-card layout-cookies" ${isRtl}>
                    <a href="${affLink}" class="close-btn">&times;</a>
                    <div class="cookies-header">
                        <span class="shield-icon">🛡️</span>
                        <div>
                            <h1 class="modal-title">${t.title}</h1>
                            <p class="modal-subtitle">${t.sub}</p>
                        </div>
                    </div>
                    <a href="${affLink}" class="cta-btn">${t.btnAccept}</a>
                    <div class="footer-text">${t.footer}</div>
                </div>`;
            } 
            else if (type === 'gender') {
                const t = DATA.gender[lang];
                layoutContent = `
                <div class="modal-card layout-gender" ${isRtl}>
                    <a href="${affLink}" class="close-btn">&times;</a>
                    <h1 class="modal-title">${t.title}</h1>
                    <p class="modal-subtitle">${t.sub}</p>
                    <div class="gender-grid">
                        <a href="${affLink}" class="gender-card">
                            <div class="gender-btn">${t.btnMale}</div>
                        </a>
                        <a href="${affLink}" class="gender-card">
                            <div class="gender-btn">${t.btnFemale}</div>
                        </a>
                    </div>
                    <div class="footer-text">${t.footer}</div>
                </div>`;
            }

            return `<!DOCTYPE html>
<html lang="${lang}" ${isRtl}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #0d1117; color: #fff; }
        
        .bg-container { position: absolute; top:0; left:0; width:100%; height:100%; z-index:1; filter: blur(8px) brightness(0.35); transform: scale(1.05); }
        .bg-iframe { width:100%; height:100%; border:none; pointer-events:none; }
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(10, 15, 30, 0.75); z-index:2; }
        .modal-wrapper { position: absolute; top:0; left:0; width:100%; height:100%; z-index:3; display:flex; align-items:center; justify-content:center; padding:20px; }
        
        /* CARD BASE */
        .modal-card { width:100%; max-width:500px; background:#161b22; border:1px solid #30363d; border-radius:16px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.8); position:relative; padding:32px 28px; }
        .close-btn { position:absolute; top:16px; right:20px; font-size:24px; font-weight:bold; color:#8b949e; text-decoration:none; line-height:1; }
        .close-btn:hover { color:#fff; }
        
        .modal-title { font-size:22px; font-weight:700; color:#fff; line-height:1.3; margin-bottom:8px; }
        .modal-subtitle { font-size:14px; color:#8b949e; line-height:1.5; margin-bottom:20px; }
        .footer-text { text-align:center; font-size:12px; color:#8b949e; margin-top:16px; }
        
        .cta-btn { display:block; width:100%; background: ${accent}; color:#fff; text-align:center; padding:16px; font-size:15px; font-weight:700; text-decoration:none; border-radius:10px; text-transform:uppercase; box-shadow: 0 4px 14px ${accent}66; transition: filter 0.2s; }
        .cta-btn:hover { filter: brightness(1.15); }

        /* LAYOUT 1: COUNTRY */
        .layout-country .badge { display:inline-block; background: ${accent}22; color: ${accent}; border:1px solid ${accent}66; font-size:11px; font-weight:700; text-transform:uppercase; padding:4px 10px; border-radius:20px; margin-bottom:12px; }
        .layout-country .country-option { background:#21262d; border:1px solid #30363d; border-radius:10px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; text-decoration:none; color:#fff; margin-bottom:12px; font-size:14px; font-weight:600; }
        .layout-country .main-opt { border: 2px solid ${accent}; }
        .layout-country .status-tag { font-size:11px; background: ${accent}; color:#fff; padding:3px 8px; border-radius:6px; font-weight:700; }

        /* LAYOUT 2: AGE */
        .layout-age { text-align: center; border-top: 4px solid ${accent}; }
        .layout-age .warning-icon { font-size: 40px; margin-bottom: 10px; }
        .layout-age .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .layout-age .btn-no { display:block; width:100%; background:#21262d; color:#8b949e; text-align:center; padding:16px; font-size:13px; font-weight:700; text-decoration:none; border-radius:10px; border:1px solid #30363d; }

        /* LAYOUT 3: COOKIES */
        .layout-cookies { max-width: 550px; background: #0d1117; border: 1px solid ${accent}88; }
        .layout-cookies .cookies-header { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 16px; }
        .layout-cookies .shield-icon { font-size: 32px; background: ${accent}22; padding: 10px; border-radius: 12px; }

        /* LAYOUT 4: GÊNERO */
        .layout-gender { text-align: center; }
        .layout-gender .gender-grid { display: flex; gap: 12px; margin-bottom: 12px; }
        .layout-gender .gender-card { flex: 1; text-decoration: none; }
        .layout-gender .gender-btn { background: #21262d; border: 2px solid #30363d; padding: 20px 10px; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 700; transition: all 0.2s; }
        .layout-gender .gender-card:hover .gender-btn { border-color: ${accent}; background: ${accent}11; }

        /* SUPORTE PARA IDIOMAS RTL (ÁRABE) */
        *[dir="rtl"] { direction: rtl; text-align: right; }
        *[dir="rtl"] .close-btn { right: auto; left: 20px; }
        *[dir="rtl"] .footer-text, *[dir="rtl"] .layout-age, *[dir="rtl"] .layout-gender { text-align: center; }
    </style>
</head>
<body>
    <div class="bg-container"><iframe class="bg-iframe" src="${bgUrl}"></iframe></div>
    <div class="overlay"></div>
    <div class="modal-wrapper">
        ${layoutContent}
    </div>
</body>
</html>`;
        }

        function updateGenerator() {
            const html = generateFullHTML();
            document.getElementById('outputCode').value = html;
            
            const iframe = document.getElementById('previewFrame');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(html);
            doc.close();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.view-page').forEach(v => v.classList.remove('active'));
            
            if (tabName === 'preview') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('previewView').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('codeView').classList.add('active');
            }
        }

        function copyCode() {
            const codeArea = document.getElementById('outputCode');
            codeArea.select();
            document.execCommand('copy');
            alert('✅ Código HTML copiado com sucesso!');
        }

        window.onload = updateGenerator;
    </script>
</body>
</html>
