        function generateFullHTML() {
            const type = document.getElementById('presellType').value;
            const lang = document.getElementById('presellLang').value;
            const affLink = document.getElementById('affLink').value || '#';
            const bgUrl = document.getElementById('bgUrl').value || 'about:blank';
            const accent = document.getElementById('accentColor').value;
            const cardBg = document.getElementById('cardBgColor').value;

            const isRtl = (lang === 'ar') ? 'dir="rtl"' : '';
            let layoutContent = "";

            if (type === 'promo') {
                const t = DATA.promo[lang] || DATA.promo['en'];
                layoutContent = `
                <div class="modal-card layout-promo" ${isRtl}>
                    <a href="${affLink}" class="close-btn">&times;</a>

                    <div class="footer-text">${t.footer}</div>

            else if (type === 'language') {
                const t = DATA.language[lang] || DATA.language['en'];
                layoutContent = `

                    <p class="modal-subtitle">${t.sub}</p>
                    
                    <a href="${affLink}" class="lang-option main-lang">
                        <span>${t.current}</span>
                        <span class="active-dot">●</span>
                    </a>
                    
                    <div class="lang-grid">
                        <a href="${affLink}" class="lang-option-pill">${t.other1}</a>

                        <a href="${affLink}" class="lang-option-pill">${t.other3}</a>
                    </div>
                    
                    <a href="${affLink}" class="cta-btn">${t.cta}</a>
                    <div class="footer-text">${t.footer}</div>
                </div>`;
            }
            else if (type === 'country') {
                const t = DATA.country[lang] || DATA.country['en'];
                layoutContent = `
                <div class="modal-card layout-country" ${isRtl}>
                    <a href="${affLink}" class="close-btn">&times;</a>
                    <span class="badge">${t.badge}</span>
                    <h1 class="modal-title">${t.title}</h1>
                    <p class="modal-subtitle">${t.sub}</p>
                    <a href="${affLink}" class="country-option main-opt">
                        <span>${t.optMain}</span>
                        <span class="status-tag">${t.optMainBadge}</span>
                    </a>
                    <a href="${affLink}" class="country-option sec-opt">

                    <div class="footer-text">${t.footer}</div>

            } 
            else if (type === 'age') {
                const t = DATA.age[lang] || DATA.age['en'];
                layoutContent = `
                <div class="modal-card layout-age" ${isRtl}>
                    <a href="${affLink}" class="close-btn">&times;</a>

                    <p class="modal-subtitle">${t.sub}</p>

                        <a href="${affLink}" class="btn-no">${t.btnNo}</a>

                    <div class="footer-text">${t.footer}</div>

            }

<html lang="${lang}" ${isRtl}>

    <meta charset="UTF-8">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background: #0d1117; color: #fff; }

        .close-btn:hover { color:#fff; }
        
        .modal-title { font-size:22px; font-weight:700; color:#fff; line-height:1.3; margin-bottom:8px; }
        .modal-subtitle { font-size:14px; color: rgba(255,255,255,0.7); line-height:1.5; margin-bottom:20px; }
        .footer-text { text-align:center; font-size:12px; color: rgba(255,255,255,0.6); margin-top:16px; }
        
        .badge { display:inline-block; background: ${accent}22; color: ${accent}; border:1px solid ${accent}66; font-size:11px; font-weight:700; text-transform:uppercase; padding:4px 10px; border-radius:20px; margin-bottom:12px; }

        .cta-btn { display:block; width:100%; background: ${accent}; color:#fff; text-align:center; padding:16px; font-size:15px; font-weight:700; text-decoration:none; border-radius:10px; text-transform:uppercase; box-shadow: 0 4px 14px ${accent}66; transition: transform 0.2s, filter 0.2s; }
        .cta-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }

        /* Layout Promoção */
        .layout-promo .promo-header-badge { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

        .layout-promo .tag-limited { font-size: 11px; font-weight: 700; background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
        .layout-promo .promo-box { display: block; background: rgba(255,255,255,0.05); border: 2px dashed ${accent}; border-radius: 12px; padding: 16px; text-align: center; text-decoration: none; margin-bottom: 20px; }
        .layout-promo .promo-box-text { color: #fff; font-size: 15px; font-weight: 700; }
        .layout-promo .pulse { animation: pulseBtn 2s infinite; }
        @keyframes pulseBtn {
            0% { box-shadow: 0 0 0 0 ${accent}88; }
            70% { box-shadow: 0 0 0 14px rgba(0, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); }
        }

        /* Layout Idioma */
        .layout-lang .lang-option { background: rgba(255,255,255,0.06); border:2px solid ${accent}; border-radius:10px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; text-decoration:none; color:#fff; margin-bottom:12px; font-size:14px; font-weight:700; }
        .layout-lang .active-dot { color: ${accent}; font-size:18px; }
        .layout-lang .lang-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:18px; }
        .layout-lang .lang-option-pill { background: rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.15); border-radius:8px; padding:10px 4px; text-align:center; text-decoration:none; color: rgba(255,255,255,0.7); font-size:12px; font-weight:600; transition:all 0.2s; }
        .layout-lang .lang-option-pill:hover { border-color: ${accent}; color:#fff; }

        /* Layout País */
        .layout-country .country-option { background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; text-decoration:none; color:#fff; margin-bottom:12px; font-size:14px; font-weight:600; }
        .layout-country .main-opt { border: 2px solid ${accent}; }
        .layout-country .status-tag { font-size:11px; background: ${accent}; color:#fff; padding:3px 8px; border-radius:6px; font-weight:700; }

        /* Layout Idade */
        .layout-age { text-align: center; border-top: 4px solid ${accent}; }
        .layout-age .warning-icon { font-size: 40px; margin-bottom: 10px; }
        .layout-age .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .layout-age .btn-no { display:block; width:100%; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); text-align:center; padding:16px; font-size:13px; font-weight:700; text-decoration:none; border-radius:10px; border:1px solid rgba(255,255,255,0.15); }

        /* Layout Cookies */
        .layout-cookies { max-width: 550px; }
        .layout-cookies .cookies-header { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 16px; }
        .layout-cookies .shield-icon { font-size: 32px; background: ${accent}22; padding: 10px; border-radius: 12px; }

        /* Layout Gênero */
        .layout-gender { text-align: center; }
        .layout-gender .gender-grid { display: flex; gap: 12px; margin-bottom: 12px; }
        .layout-gender .gender-card { flex: 1; text-decoration: none; }
        .layout-gender .gender-btn { background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.15); padding: 20px 10px; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 700; transition: all 0.2s; }
        .layout-gender .gender-card:hover .gender-btn { border-color: ${accent}; background: ${accent}22; }

        *[dir="rtl"] { direction: rtl; text-align: right; }
        *[dir="rtl"] .close-btn { right: auto; left: 20px; }
        *[dir="rtl"] .footer-text, *[dir="rtl"] .layout-age, *[dir="rtl"] .layout-gender, *[dir="rtl"] .layout-promo { text-align: center; }
    </style>
</head>
<body>
    <div class="bg-container"><iframe class="bg-iframe" src="${bgUrl}"></iframe></div>
    <div class="overlay"></div>
    <div class="modal-wrapper">
        ${layoutContent}
    </div>
</body>
</html>`;
        }

        function updateGenerator() {
            const html = generateFullHTML();
            document.getElementById('outputCode').value = html;
            
            const iframe = document.getElementById('previewFrame');
            iframe.srcdoc = html;
        }

        function switchTab(tabName) {
            const tabPreview = document.getElementById('tabPreview');
            const tabCode = document.getElementById('tabCode');
            const previewView = document.getElementById('previewView');
            const codeView = document.getElementById('codeView');
            
            if (tabName === 'preview') {
                tabPreview.classList.add('active');
                tabCode.classList.remove('active');
                previewView.classList.add('active');
                codeView.classList.remove('active');
            } else {
                tabCode.classList.add('active');
                tabPreview.classList.remove('active');
                codeView.classList.add('active');
                previewView.classList.remove('active');
            }
        }

        function copyCode(btnElement) {
            const codeArea = document.getElementById('outputCode');
            codeArea.select();
            navigator.clipboard.writeText(codeArea.value);
            
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = '✓ Copiado!';
            setTimeout(() => {
                btnElement.innerHTML = originalText;
            }, 2000);
        }

        window.onload = updateGenerator;
    </script>
</body>
</html>
